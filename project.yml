name: Mia
options:
  bundleIdPrefix: dev.mia
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Mia:
    type: application
    platform: macOS
    sources:
      - path: Mia
    resources:
      - path: Mia/Assets.xcassets
        optional: true
    info:
      path: Mia/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Mia
        CFBundleDisplayName: Mia
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "© 2026 Mia"
    entitlements:
      path: Mia/Mia.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mia.Mia
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MiaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MiaTests
    dependencies:
      - target: Mia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mia.MiaTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Mia:
    build:
      targets:
        Mia: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MiaTests
