excluded:
  - Mia.xcodeproj
  - DerivedData
  - build
  - .build
  - docs

line_length:
  warning: 160
  error: 200

function_body_length:
  warning: 80
  error: 120

type_body_length:
  warning: 500
  error: 700

file_length:
  warning: 500
  error: 700

function_parameter_count:
  warning: 6
  error: 8

identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 40
    error: 50
  excluded:
    - id
    - at
    - v
    - b
    - m
    - s
    - x
    - y
    - pb
    - db

nesting:
  type_level:
    warning: 3
    error: 4

cyclomatic_complexity:
  warning: 15
  error: 25

disabled_rules:
  - trailing_whitespace
  - todo
  - non_optional_string_data_conversion

opt_in_rules:
  - empty_count

reporter: xcode
